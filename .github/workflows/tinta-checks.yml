name: Comprobar Tinta Studio
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tinta-label-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test

  ui-smoke:
    runs-on: ubuntu-latest
    needs: tests
    defaults:
      run:
        working-directory: tinta-label-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: |
          npm run dev > /tmp/tinta-server.log 2>&1 &
          sleep 3
          node tests/ui-smoke.mjs
